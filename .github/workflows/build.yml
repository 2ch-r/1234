name: Build LuaEngineUI 1.3.2 StatusAPI Fixed

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. Setup MSBuild
      # ============================================================
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ============================================================
      # 3. 下载与旧 LuaEngineUI 源码兼容的 Dear ImGui
      #
      # LuaEngineUI 是旧工程，不能直接使用最新版 ImGui。
      # 使用 v1.89.9。
      # ============================================================
      - name: Download compatible Dear ImGui
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force external | Out-Null

          Write-Host "Downloading Dear ImGui v1.89.9..."

          Invoke-WebRequest `
            -Uri "https://github.com/ocornut/imgui/archive/refs/tags/v1.89.9.zip" `
            -OutFile "external\imgui.zip"

          Expand-Archive `
            -Path "external\imgui.zip" `
            -DestinationPath "external" `
            -Force

          if (Test-Path "external\imgui") {
              Remove-Item "external\imgui" -Recurse -Force
          }

          Rename-Item `
            "external\imgui-1.89.9" `
            "imgui"

          Write-Host ""
          Write-Host "Dear ImGui installed:"
          Get-ChildItem "external\imgui"

      # ============================================================
      # 4. 下载 Lua 5.3.6 源码
      # ============================================================
      - name: Download Lua 5.3.6
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force external | Out-Null

          Write-Host "Downloading Lua 5.3.6..."

          Invoke-WebRequest `
            -Uri "https://www.lua.org/ftp/lua-5.3.6.tar.gz" `
            -OutFile "external\lua-5.3.6.tar.gz"

          tar -xzf "external\lua-5.3.6.tar.gz" -C "external"

          Write-Host ""
          Write-Host "Lua source:"
          Get-ChildItem "external\lua-5.3.6\src"

      # ============================================================
      # 5. 安装 vcpkg 依赖
      #
      # sol2 等工程需要的头文件从 vcpkg 获取。
      # 不在后面覆盖 LibraryPath，避免 Windows SDK 丢失。
      # ============================================================
      - name: Install dependencies
        shell: cmd
        run: |
          echo ========================================
          echo Install dependencies
          echo ========================================

          C:\vcpkg\vcpkg.exe install sol2:x64-windows-static

          if errorlevel 1 exit /b 1

      # ============================================================
      # 6. 显示依赖位置，方便排错
      # ============================================================
      - name: Show dependency locations
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "Dependency locations"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "ImGui:"
          Get-ChildItem "external\imgui" | Select-Object Name

          Write-Host ""
          Write-Host "Lua:"
          Get-ChildItem "external\lua-5.3.6\src" | Select-Object Name

          Write-Host ""
          Write-Host "vcpkg include:"
          if (Test-Path "C:\vcpkg\installed\x64-windows-static\include") {
              Write-Host "OK"
          } else {
              throw "vcpkg include directory missing"
          }

      # ============================================================
      # 7. 编译 Lua 5.3.6 静态库
      #
      # 这里直接使用 MSVC cl/lib。
      # 不需要 CMake。
      # ============================================================
      - name: Build Lua 5.3.6 static library
        shell: cmd
        run: |
          echo ========================================
          echo Build Lua 5.3.6 static library
          echo ========================================

          cd /d "%GITHUB_WORKSPACE%\external\lua-5.3.6\src"

          if not exist build mkdir build

          cd build

          cl /nologo /c /O2 /MD /DLUA_COMPAT_5_2 ^
            /I.. ^
            ..\lapi.c ^
            ..\lcode.c ^
            ..\lctype.c ^
            ..\ldebug.c ^
            ..\ldo.c ^
            ..\ldump.c ^
            ..\lfunc.c ^
            ..\lgc.c ^
            ..\llex.c ^
            ..\lmem.c ^
            ..\lobject.c ^
            ..\lopcodes.c ^
            ..\lparser.c ^
            ..\lstate.c ^
            ..\lstring.c ^
            ..\ltable.c ^
            ..\ltm.c ^
            ..\lundump.c ^
            ..\lvm.c ^
            ..\lzio.c ^
            ..\lauxlib.c ^
            ..\lbaselib.c ^
            ..\lbitlib.c ^
            ..\lcorolib.c ^
            ..\ldblib.c ^
            ..\liolib.c ^
            ..\lmathlib.c ^
            ..\loslib.c ^
            ..\lstrlib.c ^
            ..\ltablib.c ^
            ..\lutf8lib.c ^
            ..\loadlib.c ^
            ..\linit.c

          if errorlevel 1 exit /b 1

          lib /nologo /OUT:lua.lib *.obj

          if errorlevel 1 exit /b 1

          if not exist lua.lib (
              echo [ERROR] lua.lib was not generated
              exit /b 1
          )

          echo.
          echo Lua library successfully generated:
          dir lua.lib

      # ============================================================
      # 8. 修复 LuaCore::lua_register / StatusAPI 兼容问题
      #
      # Lua 5.3 的 lua_register 是宏，不是 LuaCore 成员。
      # 如果旧源码写成 LuaCore::lua_register，则自动修正。
      # ============================================================
      - name: Fix LuaCore lua_register
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Fix LuaCore lua_register"
          Write-Host "========================================"

          $files = Get-ChildItem `
            -Path "$env:GITHUB_WORKSPACE\LuaEngineUI" `
            -Recurse `
            -File `
            -Include *.cpp,*.h,*.hpp

          foreach ($file in $files) {

              $text = Get-Content `
                $file.FullName `
                -Raw

              $newText = $text `
                -replace 'LuaCore::lua_register', 'lua_register'

              if ($newText -ne $text) {

                  Write-Host "Patched:"
                  Write-Host $file.FullName

                  Set-Content `
                    -Path $file.FullName `
                    -Value $newText `
                    -Encoding UTF8
              }
          }

          Write-Host ""
          Write-Host "lua_register compatibility patch complete."

      # ============================================================
      # 9. 查找 LuaEngineUI 工程文件
      # ============================================================
      - name: Verify project files
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Verify project"
          Write-Host "========================================"

          if (!(Test-Path "$env:GITHUB_WORKSPACE\LuaEngineUI.sln")) {
              throw "LuaEngineUI.sln not found"
          }

          if (!(Test-Path "$env:GITHUB_WORKSPACE\LuaEngineUI\LuaEngineUI.vcxproj")) {
              throw "LuaEngineUI.vcxproj not found"
          }

          Write-Host "LuaEngineUI.sln OK"
          Write-Host "LuaEngineUI.vcxproj OK"

      # ============================================================
      # 10. 编译 LuaEngineUI
      #
      # 重点：
      #
      # 不使用：
      #
      #   /p:LibraryPath=...
      #
      # 因为这样会覆盖 Visual Studio / Windows SDK 的默认
      # LibraryPath，从而导致：
      #
      #   LNK1181 kernel32.lib
      #
      # IncludePath 后面保留 $(IncludePath)，因此不会破坏
      # MSVC/Windows SDK 默认头文件路径。
      # ============================================================
      - name: Build LuaEngineUI Release x64
        shell: cmd
        run: |
          echo ========================================
          echo Build LuaEngineUI StatusAPI Fixed
          echo ========================================

          set "LUA_ROOT=%GITHUB_WORKSPACE%\external\lua-5.3.6\src"
          set "LUA_LIB=%GITHUB_WORKSPACE%\external\lua-5.3.6\src\build\lua.lib"
          set "IMGUI_ROOT=%GITHUB_WORKSPACE%\external\imgui"
          set "VCPKG_INCLUDE=C:\vcpkg\installed\x64-windows-static\include"

          echo.
          echo LUA_ROOT=%LUA_ROOT%
          echo LUA_LIB=%LUA_LIB%
          echo IMGUI_ROOT=%IMGUI_ROOT%
          echo VCPKG_INCLUDE=%VCPKG_INCLUDE%
          echo.

          if not exist "%LUA_LIB%" (
              echo [ERROR] Lua library missing:
              echo %LUA_LIB%
              exit /b 1
          )

          msbuild LuaEngineUI.sln /m ^
            /p:Configuration=Release ^
            /p:Platform=x64 ^
            /p:VcpkgTriplet=x64-windows-static ^
            /p:VcpkgUseStatic=true ^
            /p:VcpkgEnableManifest=false ^
            /p:IncludePath="%LUA_ROOT%;%IMGUI_ROOT%;%IMGUI_ROOT%\backends;%VCPKG_INCLUDE%;$(IncludePath)" ^
            /p:AdditionalDependencies="%LUA_LIB%;$(AdditionalDependencies)" ^
            /v:minimal

          if errorlevel 1 (
              echo.
              echo ========================================
              echo BUILD FAILED
              echo ========================================
              exit /b 1
          )

          echo.
          echo ========================================
          echo MSBUILD SUCCESS
          echo ========================================

      # ============================================================
      # 11. 搜索最终 DLL
      # ============================================================
      - name: Find LuaEngineUI DLL
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Searching for LuaEngineUI DLL"
          Write-Host "========================================"

          $dlls = Get-ChildItem `
            -Path "$env:GITHUB_WORKSPACE" `
            -Recurse `
            -File `
            -Filter "LuaEngineUI.dll"

          if (!$dlls) {
              Write-Host ""
              Write-Host "All generated DLL files:"

              Get-ChildItem `
                -Path "$env:GITHUB_WORKSPACE" `
                -Recurse `
                -File `
                -Filter "*.dll" |
                Select-Object FullName, Length

              throw "LuaEngineUI.dll not found"
          }

          Write-Host ""
          Write-Host "LuaEngineUI.dll found:"

          $dlls |
            Select-Object FullName, Length

          $dll = $dlls |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          New-Item `
            -ItemType Directory `
            -Force `
            "$env:GITHUB_WORKSPACE\artifact" |
            Out-Null

          Copy-Item `
            $dll.FullName `
            "$env:GITHUB_WORKSPACE\artifact\LuaEngineUI.dll" `
            -Force

          Write-Host ""
          Write-Host "Artifact prepared:"
          Get-Item "$env:GITHUB_WORKSPACE\artifact\LuaEngineUI.dll"

      # ============================================================
      # 12. 上传 DLL
      # ============================================================
      - name: Upload LuaEngineUI DLL
        uses: actions/upload-artifact@v4
        with:
          name: LuaEngineUI-1.3.2-StatusAPI-Fixed
          path: artifact/LuaEngineUI.dll
          if-no-files-found: error
