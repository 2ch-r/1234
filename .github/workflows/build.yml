name: Build LuaEngineUI 1.3.2 StatusAPI Fixed

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-2022

    steps:
      # ============================================================
      # Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # Setup MSBuild
      # ============================================================
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ============================================================
      # Prepare external directory
      # ============================================================
      - name: Prepare external directory
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "external") {
              Remove-Item "external" -Recurse -Force
          }

          New-Item -ItemType Directory -Force "external" | Out-Null

          Write-Host "========================================"
          Write-Host "Repository"
          Write-Host "========================================"
          Write-Host $env:GITHUB_WORKSPACE

          Write-Host ""
          Write-Host "LuaEngineUI:"
          Get-ChildItem "LuaEngineUI"

      # ============================================================
      # Dear ImGui 1.89.9
      # ============================================================
      - name: Download compatible Dear ImGui
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Download Dear ImGui 1.89.9"
          Write-Host "========================================"

          $url = "https://github.com/ocornut/imgui/archive/refs/tags/v1.89.9.zip"
          $zip = "$env:RUNNER_TEMP\imgui.zip"

          Invoke-WebRequest -Uri $url -OutFile $zip

          Expand-Archive `
            -Path $zip `
            -DestinationPath "external" `
            -Force

          if (Test-Path "external\imgui") {
              Remove-Item "external\imgui" -Recurse -Force
          }

          Rename-Item `
            "external\imgui-1.89.9" `
            "imgui"

          if (!(Test-Path "external\imgui\imgui.h")) {
              throw "imgui.h not found"
          }

          if (!(Test-Path "external\imgui\imgui.cpp")) {
              throw "imgui.cpp not found"
          }

          Write-Host "Dear ImGui OK"

      # ============================================================
      # Lua 5.3.6
      # ============================================================
      - name: Download Lua 5.3.6
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Download Lua 5.3.6"
          Write-Host "========================================"

          $url = "https://www.lua.org/ftp/lua-5.3.6.tar.gz"
          $archive = "$env:RUNNER_TEMP\lua-5.3.6.tar.gz"

          Invoke-WebRequest -Uri $url -OutFile $archive

          tar -xzf $archive -C external

          if (!(Test-Path "external\lua-5.3.6\src\lua.h")) {
              throw "Lua extraction failed"
          }

          Write-Host "Lua 5.3.6 OK"

      # ============================================================
      # sol2
      #
      # sol_ImGui.h contains:
      #
      #     #include "sol/sol.hpp"
      #
      # Therefore include root must contain:
      #
      #     sol\sol.hpp
      # ============================================================
      - name: Download sol2
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Download sol2 v3.3.0"
          Write-Host "========================================"

          $url = "https://github.com/ThePhD/sol2/archive/refs/tags/v3.3.0.zip"
          $zip = "$env:RUNNER_TEMP\sol2.zip"

          Invoke-WebRequest -Uri $url -OutFile $zip

          Expand-Archive `
            -Path $zip `
            -DestinationPath "external" `
            -Force

          if (Test-Path "external\sol2") {
              Remove-Item "external\sol2" -Recurse -Force
          }

          Rename-Item `
            "external\sol2-3.3.0" `
            "sol2"

          $solHeader = "external\sol2\include\sol\sol.hpp"

          if (!(Test-Path $solHeader)) {
              Write-Host "sol.hpp was not found at expected location."
              Write-Host ""
              Write-Host "Searching:"
              Get-ChildItem `
                "external\sol2" `
                -Filter "sol.hpp" `
                -Recurse `
                -File |
                Select-Object FullName

              throw "sol/sol.hpp not found"
          }

          Write-Host ""
          Write-Host "sol2 header:"
          Resolve-Path $solHeader

          Write-Host ""
          Write-Host "sol2 OK"

      # ============================================================
      # MinHook
      # ============================================================
      - name: Install MinHook
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Install MinHook"
          Write-Host "========================================"

          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" `
              install minhook:x64-windows-static

          if ($LASTEXITCODE -ne 0) {
              throw "vcpkg MinHook installation failed"
          }

          $root = Join-Path `
              $env:VCPKG_INSTALLATION_ROOT `
              "installed\x64-windows-static"

          $header = Join-Path $root "include\MinHook.h"
          $library = Join-Path $root "lib\minhook.x64.lib"

          if (!(Test-Path $header)) {
              throw "MinHook.h not found"
          }

          if (!(Test-Path $library)) {
              throw "minhook.x64.lib not found"
          }

          Write-Host "MinHook header:"
          Write-Host $header

          Write-Host "MinHook library:"
          Write-Host $library

      # ============================================================
      # Build Lua static library
      # ============================================================
      - name: Build Lua 5.3.6 static library
        shell: cmd
        run: |
          @echo off
          setlocal

          echo ========================================
          echo Build Lua 5.3.6 static library
          echo ========================================

          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"

          if errorlevel 1 exit /b 1

          cd /d "%GITHUB_WORKSPACE%\external\lua-5.3.6\src"

          if exist build (
              rmdir /s /q build
          )

          mkdir build

          del /q *.obj 2>nul

          cl /nologo /c /O2 /MD /DLUA_COMPAT_5_2 ^
            lapi.c ^
            lauxlib.c ^
            lbaselib.c ^
            lbitlib.c ^
            lcode.c ^
            lcorolib.c ^
            lctype.c ^
            ldblib.c ^
            ldebug.c ^
            ldo.c ^
            ldump.c ^
            lfunc.c ^
            lgc.c ^
            linit.c ^
            liolib.c ^
            llex.c ^
            lmathlib.c ^
            lmem.c ^
            loadlib.c ^
            lobject.c ^
            lopcodes.c ^
            loslib.c ^
            lparser.c ^
            lstate.c ^
            lstring.c ^
            lstrlib.c ^
            ltable.c ^
            ltablib.c ^
            ltm.c ^
            lundump.c ^
            lutf8lib.c ^
            lvm.c ^
            lzio.c

          if errorlevel 1 (
              echo LUA COMPILE FAILED
              exit /b 1
          )

          lib /nologo /OUT:build\lua.lib *.obj

          if errorlevel 1 (
              echo LUA LIB FAILED
              exit /b 1
          )

          if not exist build\lua.lib (
              echo lua.lib NOT FOUND
              exit /b 1
          )

          echo.
          echo ========================================
          echo Lua library created
          echo ========================================

          dir build\lua.lib

      # ============================================================
      # Fix LuaCore::lua_register
      # ============================================================
      - name: Fix LuaCore lua_register
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Fix LuaCore lua_register"
          Write-Host "========================================"

          $files = Get-ChildItem `
              "LuaEngineUI" `
              -Include *.cpp,*.h,*.hpp `
              -Recurse `
              -File

          foreach ($file in $files) {

              $text = Get-Content $file.FullName -Raw

              if ($text.Contains("LuaCore::lua_register")) {

                  Write-Host "Patch:"
                  Write-Host $file.FullName

                  $text = $text.Replace(
                      "LuaCore::lua_register",
                      "lua_register"
                  )

                  Set-Content `
                      -Path $file.FullName `
                      -Value $text `
                      -Encoding UTF8
              }
          }

          Write-Host "lua_register patch complete"

      # ============================================================
      # Verify sol2 specifically before touching VCXPROJ
      # ============================================================
      - name: Verify sol2 include layout
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Verify sol2"
          Write-Host "========================================"

          $includeRoot = Join-Path `
              $env:GITHUB_WORKSPACE `
              "external\sol2\include"

          $header = Join-Path `
              $includeRoot `
              "sol\sol.hpp"

          Write-Host "Include root:"
          Write-Host $includeRoot

          Write-Host ""
          Write-Host "Expected header:"
          Write-Host $header

          if (!(Test-Path $header)) {
              throw "sol/sol.hpp missing"
          }

          Write-Host ""
          Write-Host "SUCCESS: sol/sol.hpp exists"

      # ============================================================
      # Patch VCXPROJ
      # ============================================================
      - name: Patch LuaEngineUI vcxproj
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Patch LuaEngineUI.vcxproj"
          Write-Host "========================================"

          $project = Join-Path `
              $env:GITHUB_WORKSPACE `
              "LuaEngineUI\LuaEngineUI.vcxproj"

          if (!(Test-Path $project)) {
              throw "LuaEngineUI.vcxproj not found"
          }

          $luaRoot = Join-Path `
              $env:GITHUB_WORKSPACE `
              "external\lua-5.3.6\src"

          $luaLib = Join-Path `
              $luaRoot `
              "build\lua.lib"

          $imguiRoot = Join-Path `
              $env:GITHUB_WORKSPACE `
              "external\imgui"

          $imguiBackend = Join-Path `
              $imguiRoot `
              "backends"

          # THIS is the directory which contains the "sol" folder.
          #
          # external\sol2\include
          #                  |
          #                  +--- sol
          #                       |
          #                       +--- sol.hpp
          #
          $sol2Include = Join-Path `
              $env:GITHUB_WORKSPACE `
              "external\sol2\include"

          $minhookRoot = Join-Path `
              $env:VCPKG_INSTALLATION_ROOT `
              "installed\x64-windows-static"

          $minhookInclude = Join-Path `
              $minhookRoot `
              "include"

          $minhookLib = Join-Path `
              $minhookRoot `
              "lib\minhook.x64.lib"

          # --------------------------------------------------------
          # Validate
          # --------------------------------------------------------

          $required = @(
              $project,
              "$luaRoot\lua.h",
              "$luaRoot\lua.hpp",
              $luaLib,
              "$imguiRoot\imgui.h",
              "$imguiRoot\imgui.cpp",
              "$imguiRoot\imgui_draw.cpp",
              "$imguiRoot\imgui_tables.cpp",
              "$imguiRoot\imgui_widgets.cpp",
              "$imguiBackend\imgui_impl_win32.cpp",
              "$imguiBackend\imgui_impl_dx12.cpp",
              "$sol2Include\sol\sol.hpp",
              "$minhookInclude\MinHook.h",
              $minhookLib
          )

          foreach ($file in $required) {

              if (!(Test-Path $file)) {
                  throw "MISSING: $file"
              }

              Write-Host "OK: $file"
          }

          # --------------------------------------------------------
          # Load XML
          # --------------------------------------------------------

          [xml]$xml = Get-Content $project

          $ns = $xml.Project.NamespaceURI

          $manager = New-Object `
              System.Xml.XmlNamespaceManager(
                  $xml.NameTable
              )

          $manager.AddNamespace(
              "m",
              $ns
          )

          # --------------------------------------------------------
          # Patch ALL ItemDefinitionGroups
          #
          # This avoids depending on exact Condition formatting.
          # --------------------------------------------------------

          $groups = $xml.SelectNodes(
              "//m:ItemDefinitionGroup",
              $manager
          )

          if ($groups.Count -eq 0) {
              throw "No ItemDefinitionGroup found in vcxproj"
          }

          foreach ($group in $groups) {

              # ====================================================
              # Compiler
              # ====================================================

              $cl = $group.SelectSingleNode(
                  "m:ClCompile",
                  $manager
              )

              if ($null -eq $cl) {

                  $cl = $xml.CreateElement(
                      "ClCompile",
                      $ns
                  )

                  [void]$group.AppendChild($cl)
              }

              $includeNode = $cl.SelectSingleNode(
                  "m:AdditionalIncludeDirectories",
                  $manager
              )

              if ($null -eq $includeNode) {

                  $includeNode = $xml.CreateElement(
                      "AdditionalIncludeDirectories",
                      $ns
                  )

                  [void]$cl.AppendChild($includeNode)
              }

              $includeNode.InnerText = (
                  $luaRoot + ";" +
                  $imguiRoot + ";" +
                  $imguiBackend + ";" +
                  $sol2Include + ";" +
                  $minhookInclude + ";" +
                  "%(AdditionalIncludeDirectories)"
              )

              # ====================================================
              # Linker
              # ====================================================

              $link = $group.SelectSingleNode(
                  "m:Link",
                  $manager
              )

              if ($null -eq $link) {

                  $link = $xml.CreateElement(
                      "Link",
                      $ns
                  )

                  [void]$group.AppendChild($link)
              }

              $deps = $link.SelectSingleNode(
                  "m:AdditionalDependencies",
                  $manager
              )

              if ($null -eq $deps) {

                  $deps = $xml.CreateElement(
                      "AdditionalDependencies",
                      $ns
                  )

                  [void]$link.AppendChild($deps)
              }

              $deps.InnerText = (
                  $luaLib + ";" +
                  $minhookLib + ";" +
                  "d3d12.lib;" +
                  "dxgi.lib;" +
                  "dxguid.lib;" +
                  "user32.lib;" +
                  "gdi32.lib;" +
                  "%(AdditionalDependencies)"
              )
          }

          # ========================================================
          # Add ImGui implementation source files
          # ========================================================

          $imguiSources = @(
              "$imguiRoot\imgui.cpp",
              "$imguiRoot\imgui_draw.cpp",
              "$imguiRoot\imgui_tables.cpp",
              "$imguiRoot\imgui_widgets.cpp",
              "$imguiBackend\imgui_impl_win32.cpp",
              "$imguiBackend\imgui_impl_dx12.cpp"
          )

          $newGroup = $xml.CreateElement(
              "ItemGroup",
              $ns
          )

          foreach ($source in $imguiSources) {

              $exists = $false

              $nodes = $xml.SelectNodes(
                  "//m:ClCompile",
                  $manager
              )

              foreach ($node in $nodes) {

                  if ($node.GetAttribute("Include") -eq $source) {
                      $exists = $true
                      break
                  }
              }

              if (!$exists) {

                  $compileNode = $xml.CreateElement(
                      "ClCompile",
                      $ns
                  )

                  $compileNode.SetAttribute(
                      "Include",
                      $source
                  )

                  [void]$newGroup.AppendChild(
                      $compileNode
                  )

                  Write-Host "Added source:"
                  Write-Host $source
              }
          }

          if ($newGroup.ChildNodes.Count -gt 0) {

              [void]$xml.Project.AppendChild(
                  $newGroup
              )
          }

          $xml.Save($project)

          Write-Host ""
          Write-Host "========================================"
          Write-Host "VCXPROJ PATCH SUCCESS"
          Write-Host "========================================"

      # ============================================================
      # Verify patched VCXPROJ
      # ============================================================
      - name: Verify patched project
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Verify patched project"
          Write-Host "========================================"

          $project = "LuaEngineUI\LuaEngineUI.vcxproj"

          $patterns = @(
              "sol2",
              "lua.lib",
              "minhook.x64.lib",
              "imgui.cpp",
              "imgui_draw.cpp",
              "imgui_widgets.cpp",
              "imgui_tables.cpp",
              "imgui_impl_win32.cpp",
              "imgui_impl_dx12.cpp"
          )

          foreach ($pattern in $patterns) {

              Write-Host ""
              Write-Host "---- $pattern ----"

              $result = Select-String `
                  -Path $project `
                  -Pattern $pattern

              if (!$result) {
                  throw "Project does not contain: $pattern"
              }

              $result |
                  Select-Object -First 5 |
                  ForEach-Object {
                      Write-Host $_.Line
                  }
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "PROJECT VERIFY SUCCESS"
          Write-Host "========================================"

      # ============================================================
      # Build
      # ============================================================
      - name: Build LuaEngineUI Release x64
        shell: cmd
        run: |
          @echo off
          setlocal

          echo ========================================
          echo Build LuaEngineUI 1.3.2 StatusAPI Fixed
          echo ========================================

          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"

          if errorlevel 1 (
              echo VC environment setup failed
              exit /b 1
          )

          echo.
          echo ========================================
          echo Verify sol2 before MSBuild
          echo ========================================

          if not exist "%GITHUB_WORKSPACE%\external\sol2\include\sol\sol.hpp" (
              echo ERROR: sol\sol.hpp missing
              exit /b 1
          )

          echo SOL2 OK:
          echo %GITHUB_WORKSPACE%\external\sol2\include\sol\sol.hpp

          echo.
          echo ========================================
          echo Start MSBuild
          echo ========================================

          msbuild "%GITHUB_WORKSPACE%\LuaEngineUI\LuaEngineUI.vcxproj" ^
            /m ^
            /t:Rebuild ^
            /p:Configuration=Release ^
            /p:Platform=x64 ^
            /p:PreferredToolArchitecture=x64 ^
            /verbosity:minimal

          if errorlevel 1 (
              echo.
              echo ========================================
              echo LUAENGINEUI BUILD FAILED
              echo ========================================
              exit /b 1
          )

          echo.
          echo ========================================
          echo LUAENGINEUI BUILD SUCCESS
          echo ========================================

      # ============================================================
      # Find output DLL
      # ============================================================
      - name: Find LuaEngineUI DLL
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Find LuaEngineUI.dll"
          Write-Host "========================================"

          $dlls = Get-ChildItem `
              -Path $env:GITHUB_WORKSPACE `
              -Filter "LuaEngineUI.dll" `
              -Recurse `
              -File

          if (!$dlls) {

              Write-Host ""
              Write-Host "DLL files generated by project:"

              Get-ChildItem `
                  -Path $env:GITHUB_WORKSPACE `
                  -Filter "*.dll" `
                  -Recurse `
                  -File |
                  Select-Object FullName, Length

              throw "LuaEngineUI.dll not found"
          }

          $dlls |
              Select-Object FullName, Length |
              Format-Table -AutoSize

          $dll = $dlls |
              Sort-Object Length -Descending |
              Select-Object -First 1

          if (Test-Path "artifact") {
              Remove-Item "artifact" -Recurse -Force
          }

          New-Item `
              -ItemType Directory `
              -Force `
              "artifact" |
              Out-Null

          Copy-Item `
              -Path $dll.FullName `
              -Destination "artifact\LuaEngineUI.dll" `
              -Force

          Write-Host ""
          Write-Host "========================================"
          Write-Host "FINAL DLL"
          Write-Host "========================================"

          Get-Item "artifact\LuaEngineUI.dll" |
              Select-Object FullName, Length

      # ============================================================
      # Upload DLL
      # ============================================================
      - name: Upload LuaEngineUI DLL
        uses: actions/upload-artifact@v4
        with:
          name: LuaEngineUI-1.3.2-StatusAPI-Fixed-x64
          path: artifact/LuaEngineUI.dll
          if-no-files-found: error
