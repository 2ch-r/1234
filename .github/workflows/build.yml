name: Build LuaEngineUI 1.3.2 StatusAPI Fixed

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ============================================================
      # 下载 Dear ImGui 1.89.9
      # ============================================================
      - name: Download compatible Dear ImGui
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force external | Out-Null

          if (Test-Path "external\imgui") {
              Remove-Item "external\imgui" -Recurse -Force
          }

          Invoke-WebRequest `
            -Uri "https://github.com/ocornut/imgui/archive/refs/tags/v1.89.9.zip" `
            -OutFile "external\imgui.zip"

          Expand-Archive `
            -Path "external\imgui.zip" `
            -DestinationPath "external" `
            -Force

          Rename-Item `
            "external\imgui-1.89.9" `
            "imgui"

          if (!(Test-Path "external\imgui\imgui.h")) {
              throw "imgui.h not found"
          }

          Write-Host "Dear ImGui 1.89.9 OK"


      # ============================================================
      # 下载 Lua 5.3.6
      # ============================================================
      - name: Download Lua 5.3.6
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force external | Out-Null

          if (Test-Path "external\lua-5.3.6") {
              Remove-Item "external\lua-5.3.6" -Recurse -Force
          }

          Invoke-WebRequest `
            -Uri "https://www.lua.org/ftp/lua-5.3.6.tar.gz" `
            -OutFile "external\lua-5.3.6.tar.gz"

          tar -xzf "external\lua-5.3.6.tar.gz" -C "external"

          if (!(Test-Path "external\lua-5.3.6\src\lua.h")) {
              throw "lua.h not found"
          }

          Write-Host "Lua 5.3.6 OK"


      # ============================================================
      # 安装 sol2 + MinHook
      # ============================================================
      - name: Install dependencies
        shell: cmd
        run: |
          echo ========================================
          echo Install sol2 and MinHook
          echo ========================================

          C:\vcpkg\vcpkg.exe install sol2:x64-windows-static
          if errorlevel 1 exit /b 1

          C:\vcpkg\vcpkg.exe install minhook:x64-windows-static
          if errorlevel 1 exit /b 1

          echo.
          echo Dependencies installed successfully


      # ============================================================
      # 检查 MinHook
      # ============================================================
      - name: Verify MinHook
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $include = "C:\vcpkg\installed\x64-windows-static\include\MinHook.h"
          $lib = "C:\vcpkg\installed\x64-windows-static\lib\minhook.lib"

          Write-Host "========================================"
          Write-Host "Verify MinHook"
          Write-Host "========================================"

          if (!(Test-Path $include)) {
              Write-Host "Searching MinHook.h..."

              Get-ChildItem `
                "C:\vcpkg\installed\x64-windows-static" `
                -Recurse `
                -Filter "MinHook.h" |
                Select-Object FullName

              throw "MinHook.h not found"
          }

          Write-Host "MinHook header:"
          Write-Host $include

          if (!(Test-Path $lib)) {
              Write-Host ""
              Write-Host "Searching MinHook libraries..."

              Get-ChildItem `
                "C:\vcpkg\installed\x64-windows-static" `
                -Recurse `
                -Filter "*minhook*.lib" |
                Select-Object FullName

              throw "minhook.lib not found"
          }

          Write-Host ""
          Write-Host "MinHook library:"
          Write-Host $lib

          Write-Host ""
          Write-Host "MinHook OK"


      # ============================================================
      # 编译 Lua 5.3.6
      # ============================================================
      - name: Build Lua 5.3.6 static library
        shell: cmd
        run: |
          echo ========================================
          echo Build Lua 5.3.6 static library
          echo ========================================

          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"

          for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do (
              set "VSROOT=%%i"
          )

          if not defined VSROOT (
              echo [ERROR] Visual Studio not found
              exit /b 1
          )

          call "%VSROOT%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64

          if errorlevel 1 exit /b 1

          where cl.exe
          where lib.exe

          cd /d "%GITHUB_WORKSPACE%\external\lua-5.3.6\src"

          if exist build rmdir /s /q build
          mkdir build
          cd build

          cl /nologo /c /O2 /MD /DLUA_COMPAT_5_2 /I.. ^
            ..\lapi.c ^
            ..\lcode.c ^
            ..\lctype.c ^
            ..\ldebug.c ^
            ..\ldo.c ^
            ..\ldump.c ^
            ..\lfunc.c ^
            ..\lgc.c ^
            ..\llex.c ^
            ..\lmem.c ^
            ..\lobject.c ^
            ..\lopcodes.c ^
            ..\lparser.c ^
            ..\lstate.c ^
            ..\lstring.c ^
            ..\ltable.c ^
            ..\ltm.c ^
            ..\lundump.c ^
            ..\lvm.c ^
            ..\lzio.c ^
            ..\lauxlib.c ^
            ..\lbaselib.c ^
            ..\lbitlib.c ^
            ..\lcorolib.c ^
            ..\ldblib.c ^
            ..\liolib.c ^
            ..\lmathlib.c ^
            ..\loslib.c ^
            ..\lstrlib.c ^
            ..\ltablib.c ^
            ..\lutf8lib.c ^
            ..\loadlib.c ^
            ..\linit.c

          if errorlevel 1 exit /b 1

          lib /nologo /OUT:lua.lib *.obj

          if errorlevel 1 exit /b 1

          if not exist lua.lib (
              echo [ERROR] lua.lib missing
              exit /b 1
          )

          echo.
          echo LUA BUILD SUCCESS


      # ============================================================
      # 修复 LuaCore::lua_register
      # ============================================================
      - name: Fix LuaCore lua_register
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $root = "$env:GITHUB_WORKSPACE\LuaEngineUI"

          Get-ChildItem `
            -Path $root `
            -Recurse `
            -File `
            -Include *.cpp,*.h,*.hpp |
          ForEach-Object {

              $text = Get-Content $_.FullName -Raw

              if ($null -ne $text) {

                  $newText = $text -replace `
                    'LuaCore::lua_register', `
                    'lua_register'

                  if ($newText -ne $text) {

                      Write-Host "Patched:"
                      Write-Host $_.FullName

                      Set-Content `
                        $_.FullName `
                        $newText `
                        -Encoding UTF8
                  }
              }
          }


      # ============================================================
      # 检查 D3D12Hook.cpp 使用的 Hook 宏
      # ============================================================
      - name: Inspect hook selection
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "D3D12Hook hook-selection section"
          Write-Host "========================================"

          $file = "$env:GITHUB_WORKSPACE\LuaEngineUI\D3D12Hook.cpp"

          if (!(Test-Path $file)) {
              throw "D3D12Hook.cpp not found"
          }

          Get-Content $file -First 80


      # ============================================================
      # 编译 LuaEngineUI
      #
      # MINHOOK 是关键：
      #
      # /p:PreprocessorDefinitions="MINHOOK;..."
      #
      # 同时加入：
      # MinHook.h
      # minhook.lib
      # ============================================================
      - name: Build LuaEngineUI Release x64
        shell: cmd
        run: |
          echo ========================================
          echo Build LuaEngineUI 1.3.2 StatusAPI Fixed
          echo MinHook enabled
          echo ========================================

          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"

          for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do (
              set "VSROOT=%%i"
          )

          if not defined VSROOT (
              echo [ERROR] Visual Studio not found
              exit /b 1
          )

          call "%VSROOT%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64

          if errorlevel 1 exit /b 1

          set "LUA_ROOT=%GITHUB_WORKSPACE%\external\lua-5.3.6\src"
          set "LUA_LIB=%GITHUB_WORKSPACE%\external\lua-5.3.6\src\build\lua.lib"

          set "IMGUI_ROOT=%GITHUB_WORKSPACE%\external\imgui"

          set "VCPKG_ROOT=C:\vcpkg\installed\x64-windows-static"
          set "VCPKG_INCLUDE=%VCPKG_ROOT%\include"
          set "VCPKG_LIB=%VCPKG_ROOT%\lib"

          set "MINHOOK_LIB=%VCPKG_LIB%\minhook.lib"

          echo.
          echo LUA_ROOT=%LUA_ROOT%
          echo LUA_LIB=%LUA_LIB%
          echo IMGUI_ROOT=%IMGUI_ROOT%
          echo VCPKG_INCLUDE=%VCPKG_INCLUDE%
          echo MINHOOK_LIB=%MINHOOK_LIB%
          echo.

          if not exist "%LUA_LIB%" (
              echo [ERROR] lua.lib missing
              exit /b 1
          )

          if not exist "%VCPKG_INCLUDE%\MinHook.h" (
              echo [ERROR] MinHook.h missing
              exit /b 1
          )

          if not exist "%MINHOOK_LIB%" (
              echo [ERROR] minhook.lib missing
              exit /b 1
          )

          echo ========================================
          echo Start MSBuild
          echo ========================================

          msbuild LuaEngineUI.sln /m ^
            /p:Configuration=Release ^
            /p:Platform=x64 ^
            /p:VcpkgTriplet=x64-windows-static ^
            /p:VcpkgUseStatic=true ^
            /p:VcpkgEnableManifest=false ^
            /p:IncludePath="%LUA_ROOT%;%IMGUI_ROOT%;%IMGUI_ROOT%\backends;%VCPKG_INCLUDE%;$(IncludePath)" ^
            /p:PreprocessorDefinitions="MINHOOK;_CRT_SECURE_NO_WARNINGS;$(PreprocessorDefinitions)" ^
            /p:AdditionalLibraryDirectories="%VCPKG_LIB%;$(AdditionalLibraryDirectories)" ^
            /p:AdditionalDependencies="%LUA_LIB%;%MINHOOK_LIB%;$(AdditionalDependencies)" ^
            /v:minimal

          if errorlevel 1 (
              echo.
              echo ========================================
              echo LUAENGINEUI BUILD FAILED
              echo ========================================
              exit /b 1
          )

          echo.
          echo ========================================
          echo LUAENGINEUI BUILD SUCCESS
          echo ========================================


      # ============================================================
      # 找 DLL
      # ============================================================
      - name: Find LuaEngineUI DLL
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $dlls = Get-ChildItem `
            -Path "$env:GITHUB_WORKSPACE" `
            -Recurse `
            -File `
            -Filter "LuaEngineUI.dll"

          if (!$dlls) {

              Write-Host "Generated DLLs:"

              Get-ChildItem `
                -Path "$env:GITHUB_WORKSPACE" `
                -Recurse `
                -File `
                -Filter "*.dll" |
                Select-Object FullName, Length

              throw "LuaEngineUI.dll not found"
          }

          $dll = $dlls |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          New-Item `
            -ItemType Directory `
            -Path "$env:GITHUB_WORKSPACE\artifact" `
            -Force |
            Out-Null

          Copy-Item `
            $dll.FullName `
            "$env:GITHUB_WORKSPACE\artifact\LuaEngineUI.dll" `
            -Force

          Write-Host ""
          Write-Host "FINAL DLL:"
          Get-Item "$env:GITHUB_WORKSPACE\artifact\LuaEngineUI.dll"


      # ============================================================
      # 上传 DLL
      # ============================================================
      - name: Upload LuaEngineUI DLL
        uses: actions/upload-artifact@v4
        with:
          name: LuaEngineUI-1.3.2-StatusAPI-Fixed
          path: artifact/LuaEngineUI.dll
          if-no-files-found: error
          retention-days: 30
