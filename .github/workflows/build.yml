name: Build LuaEngineUI 1.3.2 StatusAPI Fixed

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-2022

    steps:
      # ============================================================
      # Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # Setup MSBuild
      # ============================================================
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ============================================================
      # Prepare external directory
      # ============================================================
      - name: Prepare external directory
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force external | Out-Null

          Write-Host "========================================"
          Write-Host "Repository root"
          Write-Host "========================================"
          Get-Location

          Write-Host ""
          Write-Host "========================================"
          Write-Host "LuaEngineUI directory"
          Write-Host "========================================"
          Get-ChildItem LuaEngineUI

      # ============================================================
      # Download compatible Dear ImGui
      #
      # IMPORTANT:
      # The existing sol_ImGui.h belongs to the older ImGui API.
      # Use 1.89.9 instead of current master.
      # ============================================================
      - name: Download compatible Dear ImGui
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://github.com/ocornut/imgui/archive/refs/tags/v1.89.9.zip"
          $zip = "$env:RUNNER_TEMP\imgui.zip"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $zip

          Expand-Archive `
            -Path $zip `
            -DestinationPath external `
            -Force

          if (Test-Path "external\imgui") {
              Remove-Item "external\imgui" -Recurse -Force
          }

          Rename-Item `
            "external\imgui-1.89.9" `
            "imgui"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "ImGui files"
          Write-Host "========================================"

          Get-ChildItem external\imgui

          Write-Host ""
          Write-Host "Backends:"
          Get-ChildItem external\imgui\backends

      # ============================================================
      # Download Lua 5.3.6
      # ============================================================
      - name: Download Lua 5.3.6
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://www.lua.org/ftp/lua-5.3.6.tar.gz"
          $archive = "$env:RUNNER_TEMP\lua-5.3.6.tar.gz"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $archive

          tar -xzf $archive -C external

          if (!(Test-Path "external\lua-5.3.6\src\lua.h")) {
              throw "Lua 5.3.6 extraction failed"
          }

          Write-Host ""
          Write-Host "Lua source:"
          Get-ChildItem external\lua-5.3.6\src

      # ============================================================
      # Install MinHook
      # ============================================================
      - name: Install MinHook
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" `
              install minhook:x64-windows-static

          $minHookInclude = Join-Path `
              $env:VCPKG_INSTALLATION_ROOT `
              "installed\x64-windows-static\include\MinHook.h"

          $minHookLib = Join-Path `
              $env:VCPKG_INSTALLATION_ROOT `
              "installed\x64-windows-static\lib\minhook.x64.lib"

          if (!(Test-Path $minHookInclude)) {
              throw "MinHook.h not found: $minHookInclude"
          }

          if (!(Test-Path $minHookLib)) {
              throw "minhook.x64.lib not found: $minHookLib"
          }

          Write-Host "MinHook header:"
          Write-Host $minHookInclude

          Write-Host "MinHook library:"
          Write-Host $minHookLib

      # ============================================================
      # Build Lua 5.3.6 static library
      # ============================================================
      - name: Build Lua 5.3.6 static library
        shell: cmd
        run: |
          @echo off
          setlocal

          echo ========================================
          echo Build Lua 5.3.6 static library
          echo ========================================

          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"

          cd /d "%GITHUB_WORKSPACE%\external\lua-5.3.6\src"

          if exist build rmdir /s /q build
          mkdir build

          cl /nologo /c /O2 /MD /DLUA_COMPAT_5_2 ^
            lapi.c ^
            lauxlib.c ^
            lbaselib.c ^
            lbitlib.c ^
            lcode.c ^
            lcorolib.c ^
            lctype.c ^
            ldblib.c ^
            ldebug.c ^
            ldo.c ^
            ldump.c ^
            lfunc.c ^
            lgc.c ^
            linit.c ^
            liolib.c ^
            llex.c ^
            lmathlib.c ^
            lmem.c ^
            loadlib.c ^
            lobject.c ^
            lopcodes.c ^
            loslib.c ^
            lparser.c ^
            lstate.c ^
            lstring.c ^
            lstrlib.c ^
            ltable.c ^
            ltablib.c ^
            ltm.c ^
            lundump.c ^
            lutf8lib.c ^
            lvm.c ^
            lzio.c

          if errorlevel 1 exit /b 1

          lib /nologo /OUT:build\lua.lib *.obj

          if errorlevel 1 exit /b 1

          if not exist build\lua.lib (
            echo ERROR: lua.lib was not generated
            exit /b 1
          )

          echo.
          echo Lua library created:
          dir build\lua.lib

      # ============================================================
      # Patch LuaCore lua_register compatibility
      # ============================================================
      - name: Fix LuaCore lua_register
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $luaCore = "LuaEngineUI\lua_core.h"

          if (!(Test-Path $luaCore)) {
              throw "lua_core.h not found"
          }

          $text = Get-Content $luaCore -Raw

          # Some versions of this project incorrectly use
          # LuaCore::lua_register.
          #
          # lua_register is a Lua macro, not a LuaCore member.
          $text = $text.Replace(
              "LuaCore::lua_register",
              "lua_register"
          )

          Set-Content `
            -Path $luaCore `
            -Value $text `
            -Encoding UTF8

          Write-Host "lua_core.h compatibility patch complete"

      # ============================================================
      # Patch VCXPROJ
      #
      # This is the important part.
      #
      # We explicitly inject:
      #
      #   Lua include
      #   ImGui include
      #   ImGui backends include
      #   MinHook include
      #
      # and compile:
      #
      #   imgui.cpp
      #   imgui_draw.cpp
      #   imgui_tables.cpp
      #   imgui_widgets.cpp
      #   imgui_impl_win32.cpp
      #   imgui_impl_dx12.cpp
      #
      # and link:
      #
      #   lua.lib
      #   minhook.x64.lib
      #   d3d12.lib
      #   dxgi.lib
      #   dxguid.lib
      # ============================================================
      - name: Patch LuaEngineUI vcxproj
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $project = Join-Path `
              $env:GITHUB_WORKSPACE `
              "LuaEngineUI\LuaEngineUI.vcxproj"

          if (!(Test-Path $project)) {
              throw "LuaEngineUI.vcxproj not found"
          }

          $luaRoot = Join-Path `
              $env:GITHUB_WORKSPACE `
              "external\lua-5.3.6\src"

          $luaLib = Join-Path `
              $luaRoot `
              "build\lua.lib"

          $imguiRoot = Join-Path `
              $env:GITHUB_WORKSPACE `
              "external\imgui"

          $imguiBackend = Join-Path `
              $imguiRoot `
              "backends"

          $minhookRoot = Join-Path `
              $env:VCPKG_INSTALLATION_ROOT `
              "installed\x64-windows-static"

          $minhookInclude = Join-Path `
              $minhookRoot `
              "include"

          $minhookLib = Join-Path `
              $minhookRoot `
              "lib\minhook.x64.lib"

          if (!(Test-Path $luaLib)) {
              throw "lua.lib missing: $luaLib"
          }

          if (!(Test-Path $minhookLib)) {
              throw "MinHook library missing: $minhookLib"
          }

          $requiredImguiFiles = @(
              "$imguiRoot\imgui.cpp",
              "$imguiRoot\imgui_draw.cpp",
              "$imguiRoot\imgui_tables.cpp",
              "$imguiRoot\imgui_widgets.cpp",
              "$imguiBackend\imgui_impl_win32.cpp",
              "$imguiBackend\imgui_impl_dx12.cpp"
          )

          foreach ($file in $requiredImguiFiles) {
              if (!(Test-Path $file)) {
                  throw "Required ImGui file missing: $file"
              }
          }

          Write-Host "========================================"
          Write-Host "Patch VCXPROJ"
          Write-Host "========================================"

          Write-Host "Project:"
          Write-Host $project

          Write-Host "Lua:"
          Write-Host $luaRoot
          Write-Host $luaLib

          Write-Host "ImGui:"
          Write-Host $imguiRoot

          Write-Host "MinHook:"
          Write-Host $minhookInclude
          Write-Host $minhookLib

          [xml]$xml = Get-Content $project

          $ns = $xml.Project.NamespaceURI

          $manager = New-Object System.Xml.XmlNamespaceManager(
              $xml.NameTable
          )

          $manager.AddNamespace("m", $ns)

          # --------------------------------------------------------
          # Patch every ItemDefinitionGroup so we don't depend on
          # the exact spelling of Release|x64.
          # --------------------------------------------------------

          $groups = $xml.SelectNodes(
              "//m:ItemDefinitionGroup",
              $manager
          )

          foreach ($group in $groups) {

              # -----------------------------
              # ClCompile
              # -----------------------------
              $cl = $group.SelectSingleNode(
                  "m:ClCompile",
                  $manager
              )

              if ($null -eq $cl) {
                  $cl = $xml.CreateElement(
                      "ClCompile",
                      $ns
                  )

                  [void]$group.AppendChild($cl)
              }

              $include = $cl.SelectSingleNode(
                  "m:AdditionalIncludeDirectories",
                  $manager
              )

              if ($null -eq $include) {
                  $include = $xml.CreateElement(
                      "AdditionalIncludeDirectories",
                      $ns
                  )

                  [void]$cl.AppendChild($include)
              }

              $include.InnerText = `
                  "$luaRoot;" +
                  "$imguiRoot;" +
                  "$imguiBackend;" +
                  "$minhookInclude;" +
                  "%(AdditionalIncludeDirectories)"

              # -----------------------------
              # Link
              # -----------------------------
              $link = $group.SelectSingleNode(
                  "m:Link",
                  $manager
              )

              if ($null -eq $link) {
                  $link = $xml.CreateElement(
                      "Link",
                      $ns
                  )

                  [void]$group.AppendChild($link)
              }

              $deps = $link.SelectSingleNode(
                  "m:AdditionalDependencies",
                  $manager
              )

              if ($null -eq $deps) {
                  $deps = $xml.CreateElement(
                      "AdditionalDependencies",
                      $ns
                  )

                  [void]$link.AppendChild($deps)
              }

              $deps.InnerText = `
                  "$luaLib;" +
                  "$minhookLib;" +
                  "d3d12.lib;" +
                  "dxgi.lib;" +
                  "dxguid.lib;" +
                  "%(AdditionalDependencies)"
          }

          # --------------------------------------------------------
          # Add ImGui implementation source files directly into the
          # project.
          # --------------------------------------------------------

          $itemGroup = $xml.CreateElement(
              "ItemGroup",
              $ns
          )

          $sources = @(
              "$imguiRoot\imgui.cpp",
              "$imguiRoot\imgui_draw.cpp",
              "$imguiRoot\imgui_tables.cpp",
              "$imguiRoot\imgui_widgets.cpp",
              "$imguiBackend\imgui_impl_win32.cpp",
              "$imguiBackend\imgui_impl_dx12.cpp"
          )

          foreach ($source in $sources) {

              $alreadyExists = $false

              $existing = $xml.SelectNodes(
                  "//m:ClCompile",
                  $manager
              )

              foreach ($node in $existing) {
                  if ($node.Include -eq $source) {
                      $alreadyExists = $true
                      break
                  }
              }

              if (!$alreadyExists) {

                  $node = $xml.CreateElement(
                      "ClCompile",
                      $ns
                  )

                  $node.SetAttribute(
                      "Include",
                      $source
                  )

                  [void]$itemGroup.AppendChild($node)
              }
          }

          if ($itemGroup.ChildNodes.Count -gt 0) {
              [void]$xml.Project.AppendChild($itemGroup)
          }

          $xml.Save($project)

          Write-Host ""
          Write-Host "========================================"
          Write-Host "VCXPROJ patched successfully"
          Write-Host "========================================"

          Get-Content $project

      # ============================================================
      # Verify project/dependencies
      # ============================================================
      - name: Verify patched project
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Verify dependencies"
          Write-Host "========================================"

          $files = @(
              "external\lua-5.3.6\src\build\lua.lib",
              "external\imgui\imgui.cpp",
              "external\imgui\imgui_draw.cpp",
              "external\imgui\imgui_tables.cpp",
              "external\imgui\imgui_widgets.cpp",
              "external\imgui\backends\imgui_impl_win32.cpp",
              "external\imgui\backends\imgui_impl_dx12.cpp",
              "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static\include\MinHook.h",
              "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static\lib\minhook.x64.lib",
              "LuaEngineUI\LuaEngineUI.vcxproj"
          )

          foreach ($file in $files) {

              if (!(Test-Path $file)) {
                  throw "MISSING: $file"
              }

              Write-Host "OK: $file"
          }

          Write-Host ""
          Write-Host "Search injected project settings:"

          Select-String `
              -Path "LuaEngineUI\LuaEngineUI.vcxproj" `
              -Pattern `
                "lua.lib", `
                "minhook.x64.lib", `
                "imgui.cpp", `
                "imgui_impl_win32.cpp", `
                "imgui_impl_dx12.cpp"

      # ============================================================
      # Build
      # ============================================================
      - name: Build LuaEngineUI Release x64
        shell: cmd
        run: |
          @echo off
          setlocal

          echo ========================================
          echo Build LuaEngineUI 1.3.2 StatusAPI Fixed
          echo ========================================

          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"

          echo.
          echo ========================================
          echo Start MSBuild
          echo ========================================

          msbuild "%GITHUB_WORKSPACE%\LuaEngineUI\LuaEngineUI.vcxproj" ^
            /m ^
            /t:Rebuild ^
            /p:Configuration=Release ^
            /p:Platform=x64 ^
            /p:PreferredToolArchitecture=x64 ^
            /verbosity:minimal

          if errorlevel 1 (
              echo.
              echo ========================================
              echo LUAENGINEUI BUILD FAILED
              echo ========================================
              exit /b 1
          )

          echo.
          echo ========================================
          echo LUAENGINEUI BUILD SUCCESS
          echo ========================================

      # ============================================================
      # Find DLL
      # ============================================================
      - name: Find LuaEngineUI DLL
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Search LuaEngineUI.dll"
          Write-Host "========================================"

          $dlls = Get-ChildItem `
              -Path $env:GITHUB_WORKSPACE `
              -Filter "LuaEngineUI.dll" `
              -Recurse `
              -File

          if (!$dlls) {
              Write-Host ""
              Write-Host "All DLL files:"
              Get-ChildItem `
                  -Path $env:GITHUB_WORKSPACE `
                  -Filter "*.dll" `
                  -Recurse `
                  -File |
                  Select-Object FullName, Length

              throw "LuaEngineUI.dll not found"
          }

          $dlls |
              Select-Object FullName, Length |
              Format-Table -AutoSize

          $dll = $dlls |
              Sort-Object Length -Descending |
              Select-Object -First 1

          New-Item `
              -ItemType Directory `
              -Force `
              artifact |
              Out-Null

          Copy-Item `
              $dll.FullName `
              "artifact\LuaEngineUI.dll" `
              -Force

          Write-Host ""
          Write-Host "Selected DLL:"
          Write-Host $dll.FullName

          Write-Host ""
          Write-Host "Artifact:"
          Get-Item "artifact\LuaEngineUI.dll"

      # ============================================================
      # Upload
      # ============================================================
      - name: Upload LuaEngineUI DLL
        uses: actions/upload-artifact@v4
        with:
          name: LuaEngineUI-1.3.2-StatusAPI-Fixed-x64
          path: artifact/LuaEngineUI.dll
          if-no-files-found: error
