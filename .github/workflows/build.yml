name: Build LuaEngineUI 1.3.2 StatusAPI Fixed

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      # ============================================================
      # Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # MSBuild
      # ============================================================
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ============================================================
      # Dear ImGui 1.89.9
      # ============================================================
      - name: Download compatible Dear ImGui
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force external | Out-Null

          if (Test-Path "external\imgui") {
              Remove-Item "external\imgui" -Recurse -Force
          }

          if (Test-Path "external\imgui.zip") {
              Remove-Item "external\imgui.zip" -Force
          }

          Invoke-WebRequest `
            -Uri "https://github.com/ocornut/imgui/archive/refs/tags/v1.89.9.zip" `
            -OutFile "external\imgui.zip"

          Expand-Archive `
            -Path "external\imgui.zip" `
            -DestinationPath "external" `
            -Force

          if (!(Test-Path "external\imgui-1.89.9")) {
              throw "imgui-1.89.9 directory not found"
          }

          Rename-Item `
            "external\imgui-1.89.9" `
            "imgui"

          if (!(Test-Path "external\imgui\imgui.h")) {
              throw "imgui.h not found"
          }

          Write-Host "Dear ImGui 1.89.9 OK"

      # ============================================================
      # Lua 5.3.6
      # ============================================================
      - name: Download Lua 5.3.6
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force external | Out-Null

          if (Test-Path "external\lua-5.3.6") {
              Remove-Item "external\lua-5.3.6" -Recurse -Force
          }

          if (Test-Path "external\lua-5.3.6.tar.gz") {
              Remove-Item "external\lua-5.3.6.tar.gz" -Force
          }

          Invoke-WebRequest `
            -Uri "https://www.lua.org/ftp/lua-5.3.6.tar.gz" `
            -OutFile "external\lua-5.3.6.tar.gz"

          tar -xzf "external\lua-5.3.6.tar.gz" -C "external"

          if (!(Test-Path "external\lua-5.3.6\src\lua.h")) {
              throw "lua.h not found"
          }

          Write-Host "Lua 5.3.6 OK"

      # ============================================================
      # sol2 + MinHook
      # ============================================================
      - name: Install dependencies
        shell: cmd
        run: |
          echo ========================================
          echo Install sol2 + MinHook
          echo ========================================

          C:\vcpkg\vcpkg.exe install sol2:x64-windows-static
          if errorlevel 1 exit /b 1

          C:\vcpkg\vcpkg.exe install minhook:x64-windows-static
          if errorlevel 1 exit /b 1

          echo.
          echo Dependencies installed successfully

      # ============================================================
      # 自动寻找 MinHook
      # 不再假定它叫 minhook.lib
      # ============================================================
      - name: Locate MinHook
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $root = "C:\vcpkg\installed\x64-windows-static"

          Write-Host "========================================"
          Write-Host "Locate MinHook"
          Write-Host "========================================"

          $header = Get-ChildItem `
            -Path $root `
            -Recurse `
            -File `
            -Filter "MinHook.h" |
            Select-Object -First 1

          if (!$header) {
              throw "MinHook.h not found"
          }

          Write-Host ""
          Write-Host "MinHook header:"
          Write-Host $header.FullName

          Write-Host ""
          Write-Host "All possible MinHook libraries:"

          $allLibs = Get-ChildItem `
            -Path $root `
            -Recurse `
            -File `
            -Filter "*.lib" |
            Where-Object {
                $_.Name -match "(?i)minhook"
            }

          $allLibs | ForEach-Object {
              Write-Host $_.FullName
          }

          if (!$allLibs) {
              Write-Host ""
              Write-Host "All libraries under vcpkg:"
              Get-ChildItem `
                -Path $root `
                -Recurse `
                -File `
                -Filter "*.lib" |
                Select-Object FullName

              throw "No MinHook library found"
          }

          # 优先 Release lib，排除 debug
          $releaseLib = $allLibs |
            Where-Object {
                $_.FullName -notmatch "\\debug\\"
            } |
            Select-Object -First 1

          if (!$releaseLib) {
              $releaseLib = $allLibs | Select-Object -First 1
          }

          Write-Host ""
          Write-Host "Selected MinHook library:"
          Write-Host $releaseLib.FullName

          "MINHOOK_HEADER=$($header.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "MINHOOK_INCLUDE=$($header.DirectoryName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "MINHOOK_LIB=$($releaseLib.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "MINHOOK_LIBDIR=$($releaseLib.DirectoryName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host ""
          Write-Host "MinHook detection SUCCESS"

      # ============================================================
      # Lua 静态库
      # ============================================================
      - name: Build Lua 5.3.6 static library
        shell: cmd
        run: |
          echo ========================================
          echo Build Lua 5.3.6 static library
          echo ========================================

          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"

          for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do (
              set "VSROOT=%%i"
          )

          if not defined VSROOT (
              echo [ERROR] Visual Studio not found
              exit /b 1
          )

          call "%VSROOT%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64

          if errorlevel 1 exit /b 1

          echo.
          echo Verify compiler:
          where cl.exe
          where lib.exe

          cd /d "%GITHUB_WORKSPACE%\external\lua-5.3.6\src"

          if exist build rmdir /s /q build

          mkdir build
          cd build

          cl /nologo /c /O2 /MD /DLUA_COMPAT_5_2 /I.. ^
            ..\lapi.c ^
            ..\lcode.c ^
            ..\lctype.c ^
            ..\ldebug.c ^
            ..\ldo.c ^
            ..\ldump.c ^
            ..\lfunc.c ^
            ..\lgc.c ^
            ..\llex.c ^
            ..\lmem.c ^
            ..\lobject.c ^
            ..\lopcodes.c ^
            ..\lparser.c ^
            ..\lstate.c ^
            ..\lstring.c ^
            ..\ltable.c ^
            ..\ltm.c ^
            ..\lundump.c ^
            ..\lvm.c ^
            ..\lzio.c ^
            ..\lauxlib.c ^
            ..\lbaselib.c ^
            ..\lbitlib.c ^
            ..\lcorolib.c ^
            ..\ldblib.c ^
            ..\liolib.c ^
            ..\lmathlib.c ^
            ..\loslib.c ^
            ..\lstrlib.c ^
            ..\ltablib.c ^
            ..\lutf8lib.c ^
            ..\loadlib.c ^
            ..\linit.c

          if errorlevel 1 (
              echo [ERROR] Lua compilation failed
              exit /b 1
          )

          lib /nologo /OUT:lua.lib *.obj

          if errorlevel 1 (
              echo [ERROR] lua.lib creation failed
              exit /b 1
          )

          if not exist lua.lib (
              echo [ERROR] lua.lib missing
              exit /b 1
          )

          echo.
          echo ========================================
          echo LUA BUILD SUCCESS
          echo ========================================

      # ============================================================
      # 修复旧 LuaCore::lua_register
      # ============================================================
      - name: Fix LuaCore lua_register
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $root = "$env:GITHUB_WORKSPACE\LuaEngineUI"

          Write-Host "========================================"
          Write-Host "Fix LuaCore::lua_register"
          Write-Host "========================================"

          Get-ChildItem `
            -Path $root `
            -Recurse `
            -File `
            -Include *.cpp,*.h,*.hpp |
          ForEach-Object {

              $text = Get-Content $_.FullName -Raw

              if ($null -ne $text) {

                  $newText = $text -replace `
                    'LuaCore::lua_register', `
                    'lua_register'

                  if ($newText -ne $text) {

                      Write-Host "Patched: $($_.FullName)"

                      Set-Content `
                        $_.FullName `
                        $newText `
                        -Encoding UTF8
                  }
              }
          }

      # ============================================================
      # 输出 Hook 源码前 100 行
      # 这一步非常重要
      # ============================================================
      - name: Inspect hook selection
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Inspect D3D12Hook.cpp"
          Write-Host "========================================"

          $file = "$env:GITHUB_WORKSPACE\LuaEngineUI\D3D12Hook.cpp"

          if (!(Test-Path $file)) {
              throw "D3D12Hook.cpp not found"
          }

          $lines = Get-Content $file

          $max = [Math]::Min(100, $lines.Count)

          for ($i = 0; $i -lt $max; $i++) {
              Write-Host ("{0,4}: {1}" -f ($i + 1), $lines[$i])
          }

      # ============================================================
      # 检查最终环境
      # ============================================================
      - name: Verify build environment
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "FINAL BUILD ENVIRONMENT"
          Write-Host "========================================"

          $luaRoot = "$env:GITHUB_WORKSPACE\external\lua-5.3.6\src"
          $luaLib  = "$luaRoot\build\lua.lib"
          $imgui   = "$env:GITHUB_WORKSPACE\external\imgui"

          Write-Host "Lua:"
          Write-Host $luaRoot

          Write-Host ""
          Write-Host "Lua library:"
          Write-Host $luaLib

          Write-Host ""
          Write-Host "ImGui:"
          Write-Host $imgui

          Write-Host ""
          Write-Host "MinHook header:"
          Write-Host $env:MINHOOK_HEADER

          Write-Host ""
          Write-Host "MinHook include:"
          Write-Host $env:MINHOOK_INCLUDE

          Write-Host ""
          Write-Host "MinHook library:"
          Write-Host $env:MINHOOK_LIB

          if (!(Test-Path $luaLib)) {
              throw "lua.lib missing"
          }

          if (!(Test-Path "$imgui\imgui.h")) {
              throw "imgui.h missing"
          }

          if (!(Test-Path $env:MINHOOK_HEADER)) {
              throw "MinHook.h missing"
          }

          if (!(Test-Path $env:MINHOOK_LIB)) {
              throw "MinHook library missing"
          }

          Write-Host ""
          Write-Host "Environment OK"

      # ============================================================
      # Build LuaEngineUI
      # ============================================================
      - name: Build LuaEngineUI Release x64
        shell: cmd
        run: |
          echo ========================================
          echo Build LuaEngineUI 1.3.2 StatusAPI Fixed
          echo ========================================

          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"

          for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do (
              set "VSROOT=%%i"
          )

          if not defined VSROOT (
              echo [ERROR] Visual Studio not found
              exit /b 1
          )

          call "%VSROOT%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64

          if errorlevel 1 exit /b 1

          set "LUA_ROOT=%GITHUB_WORKSPACE%\external\lua-5.3.6\src"
          set "LUA_LIB=%GITHUB_WORKSPACE%\external\lua-5.3.6\src\build\lua.lib"

          set "IMGUI_ROOT=%GITHUB_WORKSPACE%\external\imgui"

          set "VCPKG_ROOT=C:\vcpkg\installed\x64-windows-static"
          set "VCPKG_INCLUDE=%VCPKG_ROOT%\include"
          set "VCPKG_LIB=%VCPKG_ROOT%\lib"

          echo.
          echo ========================================
          echo Selected dependencies
          echo ========================================
          echo LUA_ROOT=%LUA_ROOT%
          echo LUA_LIB=%LUA_LIB%
          echo IMGUI_ROOT=%IMGUI_ROOT%
          echo MINHOOK_INCLUDE=%MINHOOK_INCLUDE%
          echo MINHOOK_LIB=%MINHOOK_LIB%
          echo.

          if not exist "%LUA_LIB%" (
              echo [ERROR] lua.lib missing
              exit /b 1
          )

          if not exist "%MINHOOK_LIB%" (
              echo [ERROR] MinHook library missing:
              echo %MINHOOK_LIB%
              exit /b 1
          )

          if not exist "%MINHOOK_INCLUDE%\MinHook.h" (
              echo [ERROR] MinHook.h missing
              exit /b 1
          )

          echo ========================================
          echo Start MSBuild
          echo ========================================

          msbuild LuaEngineUI.sln /m ^
            /p:Configuration=Release ^
            /p:Platform=x64 ^
            /p:VcpkgTriplet=x64-windows-static ^
            /p:VcpkgUseStatic=true ^
            /p:VcpkgEnableManifest=false ^
            /p:IncludePath="%LUA_ROOT%;%IMGUI_ROOT%;%IMGUI_ROOT%\backends;%MINHOOK_INCLUDE%;%VCPKG_INCLUDE%;$(IncludePath)" ^
            /p:PreprocessorDefinitions="MINHOOK;USE_MINHOOK;_CRT_SECURE_NO_WARNINGS;$(PreprocessorDefinitions)" ^
            /p:AdditionalLibraryDirectories="%MINHOOK_LIBDIR%;%VCPKG_LIB%;$(AdditionalLibraryDirectories)" ^
            /p:AdditionalDependencies="%LUA_LIB%;%MINHOOK_LIB%;$(AdditionalDependencies)" ^
            /v:minimal

          if errorlevel 1 (
              echo.
              echo ========================================
              echo LUAENGINEUI BUILD FAILED
              echo ========================================
              exit /b 1
          )

          echo.
          echo ========================================
          echo LUAENGINEUI BUILD SUCCESS
          echo ========================================

      # ============================================================
      # 找 LuaEngineUI.dll
      # ============================================================
      - name: Find LuaEngineUI DLL
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Search LuaEngineUI.dll"
          Write-Host "========================================"

          $dlls = Get-ChildItem `
            -Path "$env:GITHUB_WORKSPACE" `
            -Recurse `
            -File `
            -Filter "LuaEngineUI.dll"

          if (!$dlls) {

              Write-Host ""
              Write-Host "LuaEngineUI.dll not found."
              Write-Host "All generated DLLs:"

              Get-ChildItem `
                -Path "$env:GITHUB_WORKSPACE" `
                -Recurse `
                -File `
                -Filter "*.dll" |
                ForEach-Object {
                    Write-Host $_.FullName
                }

              throw "LuaEngineUI.dll not found"
          }

          $dll = $dlls |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          Write-Host ""
          Write-Host "Found:"
          Write-Host $dll.FullName

          New-Item `
            -ItemType Directory `
            -Path "$env:GITHUB_WORKSPACE\artifact" `
            -Force |
            Out-Null

          Copy-Item `
            $dll.FullName `
            "$env:GITHUB_WORKSPACE\artifact\LuaEngineUI.dll" `
            -Force

          Write-Host ""
          Write-Host "FINAL DLL:"
          Get-Item `
            "$env:GITHUB_WORKSPACE\artifact\LuaEngineUI.dll" |
            Format-List FullName,Length,LastWriteTime

      # ============================================================
      # Artifact
      # ============================================================
      - name: Upload LuaEngineUI DLL
        uses: actions/upload-artifact@v4
        with:
          name: LuaEngineUI-1.3.2-StatusAPI-Fixed
          path: artifact/LuaEngineUI.dll
          if-no-files-found: error
          retention-days: 30
